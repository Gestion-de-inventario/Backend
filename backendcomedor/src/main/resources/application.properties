spring.application.name=backendcomedor
server.servlet.context-path=/api/v1
# NEONTECH DB
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.keepalive-time=0

# JPA
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.sql.init.mode=never
spring.sql.init.data-locations=classpath:datos.sql
spring.jpa.defer-datasource-initialization=true

RENIEC_TOKEN=${RENIEC_TOKEN}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.config-url=/api/v1/api-docs/swagger-config
springdoc.swagger-ui.url=/api/v1/api-docs

spring.jackson.time-zone=America/Lima
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

# Chatbot IA
chatbot.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
chatbot.gemini.base-url=https://generativelanguage.googleapis.com/v1beta

# Configuracion Twilio
twilio.account.sid=${TWILIO_SID}
twilio.auth.token=${TWILIO_TOKEN}
twilio.phone.number=${TWILIO_PHONE_NUMBER}

app.frontend.reset-password-url=https://www.comedorpopularluzisrael.site/reset-password

vonage.api.key=${VONAGE_API_KEY}
vonage.api.secret=${VONAGE_API_SECRET}